<!DOCTYPE html>
<html>
<head>
<title>2 Player Games - Disco Battle</title>
<style>
body {
 background-color: #202020;
 color: white;
}
</style>
</head>
<body>
<a href="../index.html"><-- BACK</a>
<div><span id="score"></span><br><canvas id="gamecanvas" width=1080 height=620></canvas></div>
<script>
var canvas = document.getElementById("gamecanvas")
var ctx = canvas.getContext("2d")
var notes_on_board = []
var frames_until_next_note = 0
var keys = new Set();
var nums = []
var keys_persist = new Set();
var nums_persist = []
var scores = { red:0,blue:0 }
var wait = 200
var missednums = []
var hitnums = []
var points = []
function create_note() {
 if (Math.round(Math.random() * 1) == 0) {
  var dict_to_add = {slot:0,time:400}; notes_on_board.push(dict_to_add)
  var dict_to_add = {slot:5,time:400}; notes_on_board.push(dict_to_add)
 }
 if (Math.round(Math.random() * 1) == 0) {
  var dict_to_add = {slot:1,time:400}; notes_on_board.push(dict_to_add)
  var dict_to_add = {slot:6,time:400}; notes_on_board.push(dict_to_add)
 }
 if (Math.round(Math.random() * 1) == 0) {
  var dict_to_add = {slot:2,time:400}; notes_on_board.push(dict_to_add)
  var dict_to_add = {slot:7,time:400}; notes_on_board.push(dict_to_add)
 }
 if (Math.round(Math.random() * 1) == 0) {
  var dict_to_add = {slot:3,time:400}; notes_on_board.push(dict_to_add)
  var dict_to_add = {slot:8,time:400}; notes_on_board.push(dict_to_add)
 }
}
function gameloop() {
 hitnums = []
 missednums = []
 nums = []
 var inddd = 0
 points.forEach(p => {p.timer--;if (p.timer == 0) {points.splice(inddd,1);inddd--;} inddd++;})
 for (const k of keys) {
  if (k=="a") { nums.push(0) }
  if (k=="s") { nums.push(1) }
  if (k=="d") { nums.push(2) }
  if (k=="f") { nums.push(3) }
  if (k=="h") { nums.push(5) }
  if (k=="j") { nums.push(6) }
  if (k=="k") { nums.push(7) }
  if (k=="l") { nums.push(8) }
 }
 nums_persist = []
 for (const k of keys_persist) {
  if (k=="a") { nums_persist.push(0) }
  if (k=="s") { nums_persist.push(1) }
  if (k=="d") { nums_persist.push(2) }
  if (k=="f") { nums_persist.push(3) }
  if (k=="h") { nums_persist.push(5) }
  if (k=="j") { nums_persist.push(6) }
  if (k=="k") { nums_persist.push(7) }
  if (k=="l") { nums_persist.push(8) }
 }
 nums.forEach(n => {
  var do_remove_pnts = true;
  notes_on_board.forEach(b => {
   if (b.slot == n && b.time < 140) { do_remove_pnts = false,hitnums.push(n) }
  });
  if (do_remove_pnts) {
   if (n >= 4) {scores.blue--} else {scores.red--}
   points.push({timer:40,slot:n,value:"-"});
   missednums.push(n)
  }
 });
 keys = new Set()
 var index = 0
 notes_on_board.forEach(n => {
  if (nums.includes(n.slot) && n.time < 140) { notes_on_board.splice(index,1); index--; if (n.slot>=4) {scores.blue++;} else {scores.red++;} points.push({timer:40,slot:n.slot,value:"+"}); }
  n.time-=2
  if (n.time <= 0) { notes_on_board.splice(index,1); index--; } // erase n
  index++
 });
 if (frames_until_next_note == 0) { frames_until_next_note = wait; create_note(); if (wait > 30) {wait-=10} }
 frames_until_next_note --
 draw()
 console.log(missednums)
 document.getElementById("score").textContent = `SCORES: RED: ${scores.red}, BLUE: ${scores.blue}`
 window.requestAnimationFrame(gameloop)
}
function draw() {
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for (i=0;i<9;i++) {
  if (i != 4) {
   ctx.beginPath();
   ctx.arc((i * 50)+40,400,20,0,Math.PI*2,false);
   if (nums_persist.includes(i)) {
    ctx.strokeStyle="#FFFFFF";
   } else {
    ctx.strokeStyle="#000000";
   }
   if (hitnums.includes(i)) {
    ctx.fillStyle="#00ff00";
   } else if (missednums.includes(i)) {
    ctx.fillStyle="#aa0000";
   } else {
    ctx.fillStyle="#303030";
   }
   ctx.lineWidth=3;
   ctx.fill();
   ctx.stroke();
  }
 }
 notes_on_board.forEach(n => {
  // red ball
  ctx.beginPath();
  ctx.arc((n.slot * 50)+40,40+((400-n.time)),20,0,Math.PI*2,false);
  if (n.slot >= 4) {
   ctx.fillStyle="#0000FF";
  } else {
   ctx.fillStyle="#ff0000";
  }
  ctx.strokeStyle="#000000";
  ctx.lineWidth=3;
  ctx.fill();
  ctx.stroke();
 });
 points.forEach(pnt => {
  if (pnt.value == "+") {ctx.fillStyle = "#00ff00";} else {ctx.fillStyle = "#ff0000";}
  ctx.fillText(pnt.value+"1",(pnt.slot * 50)+40,360+pnt.timer)
 });
}
window.addEventListener('keydown', function(e) {
 if (!keys_persist.has(e.key.toLowerCase())) {
  keys.add(e.key.toLowerCase());
  keys_persist.add(e.key.toLowerCase());
  do_remove_pnts = false
 }
});
window.addEventListener('keyup', function(e) {
 keys.delete(e.key.toLowerCase());
 keys_persist.delete(e.key.toLowerCase());
});
window.requestAnimationFrame(gameloop)
</script>
</body
</html>
