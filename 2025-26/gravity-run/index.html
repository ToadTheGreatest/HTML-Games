<!DOCTYPE html>
<html>
<head>
<title>2 Player Games - Gravity Run</title>
<style>
body {
 background-color: #202020;
 color: white;
}
.canvases {
 border-width: 2px;
 border-color: "#FFFFFF";
 border-style: solid;
}
</style>
</head>
<body>
<a href="../../index.html"><-- BACK</a>
<div><span id="deathcntr"></span><br><canvas id="leftcanvas" width=540 height=620 class="canvases"></canvas><canvas id="rightcanvas" width=540 height=620 class="canvases"></canvas></div>
<script>
var leftcanvas = document.getElementById("leftcanvas");
var rightcanvas = document.getElementById("rightcanvas");
var ctxl = leftcanvas.getContext("2d");
var ctxr = rightcanvas.getContext("2d");
var level = [
 "1111001111111111111100111111001111001111100011101111111111111111100011111100011111111110001111100111101111111111111100001111111111011101110111011101110111011101110111011101110111011101110110101010111111111000111110001111111110000000111101110110101010101111",
 "1111111111001111001111110011111001111000111110111000000000000000111110001111111111000011111000111100111011110000111111111111000001110111011101110111011101110111011101110111011101110111011111111111101010101111100011111000000011111111110111011101010101010111"
]
var players = {
 red: {deaths:0,flipped:false},
 blue: {deaths:0,flipped:false}
}
var progress = 0;
var microprogress = 0;
var playing = true

var GAME_SPEED = 2; //10 NEEDS to be a multiple of THIS NUMBER

function draw() {
 ctxl.clearRect(0,0,leftcanvas.width,leftcanvas.height);
 ctxr.clearRect(0,0,rightcanvas.width,rightcanvas.height);
 //p1//
 //top//
 xpos = -microprogress * 5.4
 for (i=progress;i<progress+11;i++) {
  if (i < level[0].length) {
   if (level[0].charAt(i) === "1") {
    ctxl.fillStyle = "#00FF00";
    ctxl.fillRect(xpos,0,54,20);
   }
  } else {
   ctxl.fillStyle = "#a0a0a0";
   ctxl.fillRect(xpos,0,54,20);
  }
  xpos += 54
 }
 //bottom//
 xpos = -microprogress * 5.4
 for (i=progress;i<progress+11;i++) {
  if (i < level[1].length) {
   if (level[1].charAt(i) === "1") {
    ctxl.fillStyle = "#00FF00";
    ctxl.fillRect(xpos,leftcanvas.height-20,54,20);
   }
  } else {
   ctxl.fillStyle = "#a0a0a0";
   ctxl.fillRect(xpos,leftcanvas.height-20,54,20);
  }
  xpos += 54
 }
 ctxl.fillStyle = "#FF0000";
 if (players.red.flipped) {
  ctxl.fillRect(0,20,20,20)
 } else {
  ctxl.fillRect(0,leftcanvas.height-40,20,20)
 }
 //p2//
 //top//
 xpos = -microprogress * 5.4
 for (i=progress;i<progress+11;i++) {
  if (i < level[0].length) {
   if (level[0].charAt(i) === "1") {
    ctxr.fillStyle = "#00FF00";
    ctxr.fillRect(xpos,0,54,20);
   }
  } else {
   ctxr.fillStyle = "#a0a0a0";
   ctxr.fillRect(xpos,0,54,20);
  }
  xpos += 54
 }
 //bottom//
 xpos = -microprogress * 5.4
 for (i=progress;i<progress+11;i++) {
  if (i < level[1].length) {
   if (level[1].charAt(i) === "1") {
    ctxr.fillStyle = "#00FF00";
    ctxr.fillRect(xpos,rightcanvas.height-20,54,20);
   }
  } else {
   ctxr.fillStyle = "#a0a0a0";
   ctxr.fillRect(xpos,rightcanvas.height-20,54,20);
  }
  xpos += 54
 }
 ctxr.fillStyle = "#0000FF";
 if (players.blue.flipped) {
  ctxr.fillRect(0,20,20,20)
 } else {
  ctxr.fillRect(0,leftcanvas.height-40,20,20)
 }
}
function gameloop() {
 if (playing) {
  microprogress += GAME_SPEED;
  if (microprogress == 10) {
   progress ++;
   microprogress=0;
   if ((players.red.flipped && level[0].charAt(progress) == 0) || (!players.red.flipped && level[1].charAt(progress) == 0)) {players.red.deaths++;players.red.diedalready=true;}
   if ((players.blue.flipped && level[0].charAt(progress) == 0) || (!players.blue.flipped && level[1].charAt(progress) == 0)) {players.blue.deaths++;players.blue.diedalready=true;}
  }
  if (progress > level[0].length) {playing=false;}
 } else {
  var out = document.getElementById("deathcntr")
  if (players.red.deaths == players.blue.deaths) {out.textContent = "TIE!"}
  if (players.red.deaths < players.blue.deaths) {out.textContent = "RED WINS!"}
  if (players.red.deaths > players.blue.deaths) {out.textContent = "BLUE WINS!"}
 }
 draw();
 window.requestAnimationFrame(gameloop);
}
function input(e) {
 if (["q","w","e","r","t","a","s","d","f","g","z","x","c","v"].includes(e.key.toLowerCase())) {players.red.flipped = !players.red.flipped}
 if (["y","u","i","o","p","h","j","k","l",";","b","n","m",",","."].includes(e.key.toLowerCase())) {players.blue.flipped = !players.blue.flipped}
}
window.addEventListener("keydown",input)
window.requestAnimationFrame(gameloop)
</script>
</body>
</html>
