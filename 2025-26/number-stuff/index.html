<!DOCTYPE html>
<html>
<head>
<title></title>
<style>
button {
 border-color: #000000;
 border-width: 5px;
 border: solid;
 color: #ffffff;
 background-color: #020202;
}
</style>
</head>
<body>
<a href="../../index.html"><-- BACK</a>
<div><!--BUTTONS-->
 <button onclick="do_operation('+0.01')">+0.01</button>
 <button onclick="do_operation('+0.1')">+0.1</button>
 <button onclick="do_operation('+1')">+1</button>
 <button onclick="do_operation('+10')">+10</button>
 <button onclick="do_operation('+100')">+100</button>
 <br>
 <button onclick="do_operation('-0.01')">-0.01</button>
 <button onclick="do_operation('-0.1')">-0.1</button>
 <button onclick="do_operation('-1')">-1</button>
 <button onclick="do_operation('-10')">-10</button>
 <button onclick="do_operation('-100')">-100</button>
 <br>
 <button onclick="do_operation('*0.01')">*0.01</button>
 <button onclick="do_operation('*0.1')">*0.1</button>
 <button onclick="do_operation('*10')">*10</button>
 <button onclick="do_operation('*100')">*100</button>
 <br>
 <button onclick="do_operation('MI')">Multiplicative Inverse</button>
 <button onclick="do_operation('AI')">Additive Inverse</button>
</div>
<div>
 <span id="numba">0.00</span>
</div>
<script>
const raw_params = window.location.search;
const url_params = new URLSearchParams(raw_params)
var num = 0
do_operation("")
if (url_params.get("mode")==="challenge") {num = Math.round((Math.random()*20000)-10000)/10;do_operation("chal")}
function do_operation(op) {
 if (op === '+0.01') {num += 0.01;}
 if (op === '+0.1') {num += 0.1;}
 if (op === '+1') {num ++;}
 if (op === '+10') {num += 10;}
 if (op === '+100') {num += 100;}

 if (op === '-0.01') {num -= 0.01;}
 if (op === '-0.1') {num -= 0.1;}
 if (op === '-1') {num --;}
 if (op === '-10') {num -= 10;}
 if (op === '-100') {num -= 100;}

 if (op === '*0.01') {num *= 0.01;}
 if (op === '*0.1') {num *= 0.1;}
 if (op === '*10') {num *= 10;}
 if (op === '*100') {num *= 100;}

 if (op === "AI") {num = -num;}
 if (op === "MI") {num = 1/num;}
 
 document.getElementById("numba").textContent = num;
 if (op === "chal") {document.getElementById("numba").textContent = `Try to get to 0 from ${num}`}
}
</script>
</body>
</html>
