<!DOCTYPE html>
<html>
<head>
<title>2 Player Games - Pong</title>
<style>
body {
 background-color: #202020;
}
span {
 color: #ffffff;
}
canvas {
 border-width: 3px;
 border-style: solid;
 border-color: #000000;
}
</style>
</head>
<body>
<a href="../index.html"><-- BACK</a>
<div>
 <span id="scores">JavaScript is disabled on your browser. Enable and reload to play.</span>
 <canvas id="gamecanvas" width=1080 height=620></canvas>
</div>
<script>
var canvas = document.getElementById("gamecanvas");
var ctx = canvas.getContext("2d");
var MIN_SPEED = 4
var BALL_SPEED = MIN_SPEED
var right = false
var ball = {
 vel:{
  x:-BALL_SPEED,
  y:0
 },
 pos:{
  x:canvas.width/2,
  y:canvas.height/2,
 }
};
var paddles = {
 one: (canvas.height/2)-40,
 two: (canvas.height/2)-40
}
var pressed = []
var PADDLE_SPEED = 8
var scores = {left:0,right:0}
function getVx(vy) {
 return Math.sqrt(1 - Math.pow(vy, 2));
}
function draw() {
 //RESET
 ctx.clearRect(0,0,canvas.width,canvas.height);
 //BALL
 ctx.beginPath();
 ctx.arc(ball.pos.x,ball.pos.y,5,0,Math.PI*2,false);
 ctx.fillStyle = "#ffffff";
 ctx.fill()
 //PADDLE 1
 ctx.fillStyle="#ffffff";
 ctx.fillRect(0,paddles.one,5,80);
 //PADDLE 2
 ctx.fillStyle="#ffffff";
 ctx.fillRect(canvas.width-5,paddles.two,5,80);
}
function clamp(num,min,max) {
 if (num < min) {
  return min;
 } else if (num > max) {
  return max;
 } else {
  return num;
 }
}
function gameloop() {
 if (!right) {
  if (pressed.includes("s")) {paddles.one+=PADDLE_SPEED;}
  if (pressed.includes("w")) {paddles.one-=PADDLE_SPEED;}
 } else {
  if (pressed.includes("s")) {paddles.two+=PADDLE_SPEED;}
  if (pressed.includes("w")) {paddles.two-=PADDLE_SPEED;}
 }
 paddles.one = clamp(paddles.one,0,canvas.height-80)
 paddles.two = clamp(paddles.two,0,canvas.height-80)
 ball.pos.x += ball.vel.x
 ball.pos.y += ball.vel.y
 // PADDLE 1 COLLISION
 if (ball.pos.x < 10 && ball.vel.x < 0) { 
  if (ball.pos.y > paddles.one - 5 && ball.pos.y < paddles.one + 85) {
   var difference = (ball.pos.y - (paddles.one + 40)) / 55
   var new_x = getVx(difference)
   var new_y = difference
   ball.vel.x = new_x * BALL_SPEED
   ball.vel.y = new_y * BALL_SPEED
   console.log(difference)
   BALL_SPEED += 0.25
   right = true
  } else { ball.pos.x = canvas.width/2; ball.pos.y = canvas.height/2; ball.vel.x = MIN_SPEED; ball.vel.y = 0; scores.right++; paddles.one = (canvas.height/2)-40; paddles.two = (canvas.height/2)-40; BALL_SPEED = MIN_SPEED; right = true;} }
 // PADDLE 2 COLLISION
 if (ball.pos.x > canvas.width-10 && ball.vel.x > 0) {
  if (ball.pos.y > paddles.two - 5 && ball.pos.y < paddles.two + 85) {
   var difference = (ball.pos.y - (paddles.two + 40)) / 50
   var new_x = -getVx(difference)
   var new_y = difference
   ball.vel.x = new_x * BALL_SPEED
   ball.vel.y = new_y * BALL_SPEED
   console.log(difference)
   BALL_SPEED += 0.25
   right = false
  } else { ball.pos.x = canvas.width/2; ball.pos.y = canvas.height/2; ball.vel.x = -MIN_SPEED; ball.vel.y = 0; scores.left++; paddles.one = (canvas.height/2)-40; paddles.two = (canvas.height/2)-40; BALL_SPEED = MIN_SPEED; right = false; } }
 if (ball.pos.y < 0 && ball.vel.y < 5) {ball.vel.y = -ball.vel.y}
 if (ball.pos.y > canvas.height-5 && ball.vel.y > 0) {ball.vel.y = -ball.vel.y}
 document.getElementById("scores").textContent = `LEFT'S SCORE: ${scores.left}, RIGHT'S SCORE: ${scores.right}`
 draw();
 PADDLE_SPEED = BALL_SPEED + 1.25
 window.requestAnimationFrame(gameloop);
}
window.addEventListener('keydown', function(e) {
 if (!pressed.includes(e.key.toLowerCase())) {pressed.push(e.key.toLowerCase())}
});
window.addEventListener('keyup', function(e) {
 pressed.splice(pressed.indexOf(e.key.toLowerCase()),1)
});
window.requestAnimationFrame(gameloop);
</script>
</body>
</html>
