<!DOCTYPE html>
<html>
<head>
<title>2 Player Games - Sword Battle</title>
<style>
body {
 background-color: #202020;
}
.hud {
 color: #fff;
 background-color: #000;
}
</style>
</head>
<body>
<a href="../index.html"><-- BACK</a>
<div><span id="winna" class="hud">JavaScript is disabled for this site. Enable it to play.</span><br><canvas id="gamecanvas" width=1080 height=620></canvas></div>
<script>
// JS GAME CODE HERE
var canvas = document.getElementById("gamecanvas");
var ctx = canvas.getContext("2d")
// GAME VARS
var player_1 = {
 position: {x:(canvas.width/2)-30,y:canvas.height/2},
 velocity: {x:0,y:0},
 grounded: false,
 hp: 20,
 damage: 1,
 atk_tmr: 0,
 dead: false,
 crouched: false
}
var player_2 = {
 position: {x:(canvas.width/2)+30,y:canvas.height/2},
 velocity: {x:0,y:0},
 grounded: false,
 hp: 20,
 damage: 1,
 atk_tmr: 0,
 dead: false,
 crouched: false
}
playing = true
// GAME FUNCS
function draw() {
 // RESET CANVAS
 ctx.clearRect(0,0,canvas.width,canvas.height);
 // DRAW GROUND
 ctx.fillStyle = "#502000";
 ctx.fillRect(0,canvas.height-20,canvas.width,20);
 // PLAYER 1
 if (!player_1.dead) {
  ctx.fillStyle = "#FF0000";
  if (player_1.crouched) {
   ctx.fillRect(player_1.position.x,player_1.position.y+20,10,20)
  } else {
   ctx.fillRect(player_1.position.x,player_1.position.y,10,40)
  }
  if (player_1.atk_tmr > 0) {
   ctx.fillStyle = `rgba(255,255,255,${player_1.atk_tmr/10})`;
   ctx.beginPath();
   ctx.arc(player_1.position.x+5,player_1.position.y+20,50,0,Math.PI*2,false)
   ctx.fill()
  }
 }
 // PLAYER 2
 if (!player_2.dead) {
  ctx.fillStyle = "#0000FF";
  if (player_2.crouched) {
   ctx.fillRect(player_2.position.x,player_2.position.y+20,10,20)
  } else {
   ctx.fillRect(player_2.position.x,player_2.position.y,10,40)
  }
  if (player_2.atk_tmr > 0) {
   ctx.fillStyle = `rgba(255,255,255,${player_2.atk_tmr/10})`;
   ctx.beginPath();
   ctx.arc(player_2.position.x+5,player_2.position.y+20,50,0,Math.PI*2,false)
   ctx.fill()
  }
 }
}
function gameloop() {
  // VELOCITY TO POSITION
  player_1.position.x += player_1.velocity.x
  player_1.position.y += player_1.velocity.y
  player_2.position.x += player_2.velocity.x
  player_2.position.y += player_2.velocity.y

  if (player_1.atk_tmr > 0) {player_1.atk_tmr--}
  if (player_2.atk_tmr > 0) {player_2.atk_tmr--}
  // GRAVITY
  // pl 1
  if (player_1.position.y < canvas.height-60) {
   player_1.velocity.y += 1;
   player_1.grounded = false
  } else {
   player_1.position.y = canvas.height-60;
   player_1.velocity.y = 0
   player_1.grounded = true
  }
  // pl 2
  if (player_2.position.y < canvas.height-60) {
   player_2.velocity.y += 1;
   player_2.grounded = false
  } else {
   player_2.position.y = canvas.height-60;
   player_2.velocity.y = 0
   player_2.grounded = true
  }
  // REDRAW
  draw()
  // RECALL
  window.requestAnimationFrame(gameloop)
 if (playing) {
  document.getElementById("winna").textContent = `RED'S HP: ${player_1.hp}, BLUE'S HP: ${player_2.hp}`
 } else {
  player_1.dead = player_1.hp <= 0
  player_2.dead = player_2.hp <= 0
  if (player_1.dead && !player_2.dead) { document.getElementById("winna").textContent = "BLUE WINS!" }
  if (player_2.dead && !player_1.dead) { document.getElementById("winna").textContent = "RED WINS!" }
  if (player_1.dead && player_2.dead) { document.getElementById("winna").textContent = "SOMEHOW, YOU BOTH DIED!" }
 }
}
function _input(event) {
 var speed = 0
 if (player_1.crouched) {speed = 1} else {speed = 4} 
 if (event.key.toLowerCase() == "w" && player_1.grounded) {player_1.velocity.y = -20}
 if (event.key.toLowerCase() == "a") { player_1.velocity.x = -speed }
 if (event.key.toLowerCase() == "d") { player_1.velocity.x = speed }
 if (event.key.toLowerCase() == "s") { player_1.crouched = true }
 if ((event.key.toLowerCase() == "q" || event.key.toLowerCase() == "e") && player_1.atk_tmr == 0) { player_1.atk_tmr = 10; if (isClose(player_1.position,player_2.position,50) && playing) { player_2.hp -= player_1.damage } if (player_2.hp <= 0) {playing=false} }
 
 if (player_2.crouched) {speed = 1} else {speed = 4} 
 if (event.key.toLowerCase() == "i" && player_2.grounded) {player_2.velocity.y = -20}
 if (event.key.toLowerCase() == "j") { player_2.velocity.x = -speed }
 if (event.key.toLowerCase() == "l") { player_2.velocity.x = speed }
 if (event.key.toLowerCase() == "k") { player_2.crouched = true }
 if ((event.key.toLowerCase() == "u" || event.key.toLowerCase() == "o") && player_2.atk_tmr == 0) { player_2.atk_tmr = 10; if (isClose(player_1.position,player_2.position,50) && playing) { player_1.hp -= player_2.damage }  if (player_1.hp <= 0) {playing=false} }
}
function _uninput(event) {
 if (event.key.toLowerCase() == "a" && player_1.velocity.x < 0) { player_1.velocity.x = 0 }
 if (event.key.toLowerCase() == "d" && player_1.velocity.x > 0) { player_1.velocity.x = 0 }
 if (event.key.toLowerCase() == "s") { player_1.crouched = false }

 if (event.key.toLowerCase() == "j" && player_2.velocity.x < 0) { player_2.velocity.x = 0 }
 if (event.key.toLowerCase() == "l" && player_2.velocity.x > 0) { player_2.velocity.x = 0 }
 if (event.key.toLowerCase() == "k") { player_2.crouched = false }
}
function isClose(p1, p2, threshold = 50) {
 const dx = p2.x - p1.x;
 const dy = p2.y - p1.y;
 const distanceSquared = dx * dx + dy * dy;
 return distanceSquared <= (threshold * threshold);
}
// INITIATE
window.addEventListener("keydown",_input);
window.addEventListener("keyup",_uninput);
window.requestAnimationFrame(gameloop);
</script>
</body>
</html>
